<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Marines dismounting: three silhouettes come down the ramp and walk up the sand, drawn
       larger as they come nearer. Each is drawn where it settles. Nothing is carried.

       The figures are a little larger than true scale against the craft, because at the size of
       a tile a true-scale figure is two pixels of nothing. -->

  <defs>
    <!-- One walking silhouette, standing on the origin, 27 units tall. Placed and sized by the
         transform on each actor, so every figure on the page is the same drawing. -->
    <g id="walker">
      <circle cx="0" cy="-23" r="4" />
      <path d="M-4-18h8l2 10h-3l2 8h-3l-2-7-3 7h-3l2-8h-3Z" />
    </g>
  </defs>

  <g data-actor="march-a" transform="translate(88 280) scale(0.95)" fill="#14313a">
    <use href="#walker" />
  </g>

  <g data-actor="march-b" transform="translate(56 292) scale(1.15)" fill="#122b33">
    <use href="#walker" />
  </g>

  <g data-actor="march-c" transform="translate(26 304) scale(1.35)" fill="#0f252c">
    <use href="#walker" />
  </g>
</svg>
