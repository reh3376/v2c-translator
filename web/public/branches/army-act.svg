  </g>

  <g data-actor="troop-b" transform="translate(394 296) scale(1)" fill="#122426">
    <use href="#walker" />
  </g>

  <g data-actor="troop-c" transform="translate(410 304) scale(1.12)" fill="#101f20">
    <use href="#walker" />
