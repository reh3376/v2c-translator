<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- A tracked infantry carrier pulls up nearer the viewer than the truck already in the scene,
       its rear ramp drops, and three soldiers step down behind it. The silhouette is generic: no
       marking, number, emblem or insignia, and the turret carries nothing. The figures are a
       little larger than true scale against the vehicle, because at the size of a tile a
       true-scale figure is two pixels of nothing. -->

  <defs>
    <g id="walker">
      <circle cx="0" cy="-23" r="4" />
      <path d="M-4-18h8l2 10h-3l2 8h-3l-2-7-3 7h-3l2-8h-3Z" />
    </g>
  </defs>

  <g data-actor="ifv">
    <ellipse cx="308" cy="298" rx="60" ry="4" fill="#0f1f20" opacity="0.25" />
    <path d="M252 284h114v9H252Z" fill="#101f20" />
    <g fill="#24403c">
      <circle cx="262" cy="288" r="4.5" />
      <circle cx="281" cy="288" r="4.5" />
      <circle cx="300" cy="288" r="4.5" />
      <circle cx="319" cy="288" r="4.5" />
      <circle cx="338" cy="288" r="4.5" />
      <circle cx="357" cy="288" r="4.5" />
    </g>
    <path d="M254 284v-14l20-14h92v28Z" fill="#15292a" />
    <path d="M288 256v-13h34l3 13Z" fill="#1b3233" />
    <path d="M308 246h11v5h-11Z" fill="#43605c" />
    <path d="M276 264h13v7h-13Z" fill="#2c4442" />
  </g>

