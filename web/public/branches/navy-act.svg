<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- A ceremonial gun salute: three smoke puffs rising out to open sea, and a pennant at the
       mast. Each actor is drawn where it settles; the page animates it in and out from there.
       Nothing is aimed, nothing is fired at, and no round, flash or flame is drawn. -->

  <g data-actor="puff-a" fill="#f1f6f3">
    <circle cx="150" cy="170" r="9" opacity="0.9" />
    <circle cx="141" cy="176" r="6.5" opacity="0.75" />
    <circle cx="159" cy="175" r="5.5" opacity="0.7" />
  </g>

  <g data-actor="puff-b" fill="#eaf2ef">
    <circle cx="127" cy="150" r="11" opacity="0.85" />
    <circle cx="116" cy="157" r="7.5" opacity="0.7" />
    <circle cx="138" cy="157" r="6.5" opacity="0.65" />
  </g>

  <g data-actor="puff-c" fill="#e3edea">
    <circle cx="101" cy="128" r="13" opacity="0.7" />
    <circle cx="88" cy="136" r="8.5" opacity="0.55" />
    <circle cx="114" cy="136" r="7" opacity="0.5" />
  </g>

  <g data-actor="pennant">
    <path d="M210 140l28 6-28 7Z" fill="#dfe9e6" />
    <path d="M210 139h2.5v16h-2.5Z" fill="#9fb6b8" />
  </g>
</svg>
