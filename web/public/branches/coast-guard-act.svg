<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- A boarding: the small boat comes alongside the cutter and two crew step across to its
       after deck. Each actor is drawn where it settles. Nothing is carried. -->

  <defs>
    <g id="walker">
      <circle cx="0" cy="-23" r="4" />
      <path d="M-4-18h8l2 10h-3l2 8h-3l-2-7-3 7h-3l2-8h-3Z" />
    </g>
  </defs>

  <g data-actor="boat">
    <path d="M346 200h54l-6 14h-44Z" fill="#17333c" />
    <path d="M356 192h12v8h-12Z" fill="#20454e" />
    <path d="M342 212c18 4 44 4 62 0-16 6-44 6-62 0Z" fill="#e8f4f1" opacity="0.7" />
  </g>

  <g data-actor="crew-a" transform="translate(316 196) scale(0.82)" fill="#0f2b34">
    <use href="#walker" />
  </g>

  <g data-actor="crew-b" transform="translate(330 197) scale(0.78)" fill="#13313a">
    <use href="#walker" />
  </g>
</svg>
