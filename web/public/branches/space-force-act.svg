<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <!-- Monitoring, not targeting: a soft beam sweeps a map grid on the earth below and three
       status markers settle into view as ripples. No crosshair, reticle or target is drawn. -->

  <defs>
    <linearGradient id="sf-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cdeef3" stop-opacity="0.42" />
      <stop offset="1" stop-color="#cdeef3" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g data-actor="grid" stroke="#9fdee7" fill="none" opacity="0.3">
    <path d="M118 218c70-14 176-14 246 0" stroke-width="1.4" />
    <path d="M96 252c80-16 206-16 288 0" stroke-width="1.4" />
    <path d="M84 288c86-18 222-18 312 0" stroke-width="1.4" />
    <path d="M176 206c-10 36-12 70-6 104" stroke-width="1.2" />
    <path d="M240 202v108" stroke-width="1.2" />
    <path d="M304 206c10 36 12 70 6 104" stroke-width="1.2" />
  </g>

  <g data-actor="beam">
    <path d="M350 126l56 126H298Z" fill="url(#sf-beam)" />
    <path d="M350 126l2 120h-4Z" fill="#dff3f6" opacity="0.3" />
  </g>

  <g data-actor="ping-a" fill="none" stroke="#c6e6e9">
    <circle cx="208" cy="234" r="9" stroke-width="1.8" opacity="0.8" />
    <circle cx="208" cy="234" r="3" stroke-width="3" opacity="0.9" />
  </g>

  <g data-actor="ping-b" fill="none" stroke="#bfe2e4">
    <circle cx="286" cy="258" r="10" stroke-width="1.8" opacity="0.75" />
    <circle cx="286" cy="258" r="3.2" stroke-width="3" opacity="0.85" />
  </g>

  <g data-actor="ping-c" fill="none" stroke="#b6dde0">
    <circle cx="158" cy="282" r="11" stroke-width="1.8" opacity="0.7" />
    <circle cx="158" cy="282" r="3.4" stroke-width="3" opacity="0.8" />
  </g>
</svg>
