[project]
name = "dd214kw"
version = "0.1.0"
description = "Translate a DD-214 into civilian workforce keywords (O*NET-based)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pypdf>=5.0",
    "rapidfuzz>=3.9",
    "rich>=13.7",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17"]

[project.scripts]
dd214kw = "dd214kw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dd214kw"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "reportlab>=4.2"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
