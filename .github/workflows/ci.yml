name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts

  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/pii_guard.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      DD214KW_INDEX: ${{ github.workspace }}/data/index.sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: onet-raw-${{ hashFiles('src/dd214kw/index.py') }}
      - run: uv sync --locked
      - run: uv run dd214kw build-index --download
      - name: Require the index, so end-to-end tests run instead of skipping
        run: test -s "$DD214KW_INDEX"
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv export --locked --all-extras --all-groups --no-emit-project -q -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip

  web:
    runs-on: ubuntu-latest
    env:
      DD214KW_INDEX: ${{ github.workspace }}/data/index.sqlite
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: onet-raw-${{ hashFiles('src/dd214kw/index.py') }}
      - name: Build the index, so the route tests and e2e run the real CLI
        working-directory: .
        run: |
          uv sync --locked
          uv run dd214kw build-index --download
          test -s "$DD214KW_INDEX"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end test in the runner's Chrome
        run: pnpm e2e
      - name: End-to-end test again, served under a base path
        # The hosted deploy publishes the app at /v2c, and the paths Next.js does not
        # rewrite itself only break there. A second build, because basePath belongs to
        # the build; one spec, because the rest of the suite is about what the page does
        # and a prefix does not change that.
        run: pnpm e2e:base-path

  image:
    name: image (build + smoke)
    runs-on: ubuntu-latest
    needs: [lint, pii-guard, test, web]
    permissions:
      contents: read
      packages: write # only this job publishes to GHCR
    env:
      # Push on push-to-main; every other event builds and smoke-tests without
      # publishing, so a pull request cannot put anything in the registry.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: image tags
        id: tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sha=${GITHUB_SHA::12}
          echo "sha_tag=ghcr.io/${owner}/v2c-translator:${sha}" >> "$GITHUB_OUTPUT"
          echo "main_tag=ghcr.io/${owner}/v2c-translator:main" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      # Loaded into the local daemon rather than pushed, so the smoke test runs against
      # the bytes that would be published. The push below re-exports the same cached
      # layers and builds nothing again.
      - name: build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.main_tag }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,mode=max,scope=image

      # Pages drive the container's memory, not file size, so the smoke test wants a
      # multi-page scan. The second scan is a plain office scanner's own PDF, whose
      # reading of block 12 is garbled, so the smoke test can prove every value in that
      # block is still re-read from the page image inside the read-only container. That is
      # the path the hosted deploy got wrong. Both are drawn here; no PDF or image is
      # committed to this repository.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: draw the scans the smoke test reads
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          uv sync --locked --extra ocr
          uv run --extra ocr python tests/make_scan.py --out "$RUNNER_TEMP/scan.pdf" --pages 5
          uv run --extra ocr python tests/make_scan.py --out "$RUNNER_TEMP/rescan.pdf" \
            --kind text-layer --dpi 150

      - name: smoke-test the image
        run: |
          deploy/smoke.sh "${{ steps.tags.outputs.sha_tag }}" \
            --scan "$RUNNER_TEMP/scan.pdf" --block12 "$RUNNER_TEMP/rescan.pdf"
        id: smoke

      - name: log in to ghcr
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push the image
        if: env.PUSH == 'true'
        run: |
          docker push "${{ steps.tags.outputs.sha_tag }}"
          docker push "${{ steps.tags.outputs.main_tag }}"

      - name: summary
        if: always()
        run: |
          {
            echo "### Image"
            echo
            echo "- \`${{ steps.tags.outputs.sha_tag }}\`"
            echo "- \`${{ steps.tags.outputs.main_tag }}\`"
            echo "- pushed: ${PUSH}"
            echo "- size to pull: ${{ steps.smoke.outputs.IMAGE_MIB || 'n/a' }} MiB"
            echo "- size unpacked: ${{ steps.smoke.outputs.ROOTFS_MIB || 'n/a' }} MiB"
            echo "- peak memory under OCR: ${{ steps.smoke.outputs.PEAK_RSS_MIB || 'n/a' }} MiB"
          } >> "$GITHUB_STEP_SUMMARY"
